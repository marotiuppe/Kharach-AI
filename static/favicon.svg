<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="8"/>

  <!-- Glowing Lightbulb Body -->
  <g filter="url(#glow)">
    <!-- Lightbulb Filament Spark / Light rays -->
    <circle cx="256" cy="200" r="100" fill="url(#bulbGrad)" opacity="0.9" />
    
    <!-- Bulb Base -->
    <path d="M 216 310 L 296 310 L 286 350 L 226 350 Z" fill="#a5b4fc" />
    <path d="M 230 360 L 282 360 L 274 380 L 238 380 Z" fill="#6366f1" />

    <!-- AI Sparkle Icons -->
    <path d="M 140 120 Q 150 140 170 150 Q 150 160 140 180 Q 130 160 110 150 Q 130 140 140 120 Z" fill="#f472b6" />
    <path d="M 370 180 Q 378 195 395 200 Q 378 205 370 220 Q 362 205 345 200 Q 362 195 370 180 Z" fill="#38bdf8" />

    <!-- Financial Bar Chart Overlay inside bulb -->
    <rect x="200" y="220" width="22" height="50" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="234" y="190" width="22" height="80" rx="4" fill="#ffffff" opacity="0.95"/>
    <rect x="268" y="160" width="22" height="110" rx="4" fill="url(#chartGrad)"/>
    <rect x="302" y="200" width="22" height="70" rx="4" fill="#ffffff" opacity="0.95"/>
  </g>
</svg>
